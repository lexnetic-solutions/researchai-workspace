name: Release

# Phase 9 (spec §37/§48): tag-triggered installer builds. Builds the frozen
# document-engine sidecar per OS (PyInstaller), then the Tauri bundle, and
# attaches DMG/APP/NSIS/AppImage/deb artefacts to the GitHub release. macOS
# signing is enabled by repository secrets; without them builds are ad-hoc
# signed.

on:
  push:
    tags: ['v*']

# A dry-run rehearsal of this pipeline (no release attach, empty
# permissions) lives in release-dry-run.yml — run it when touching the
# packaging inputs before spending a real tag.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundles:
    name: Installers · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple Silicon
            target: aarch64-apple-darwin
          - os: macos-13 # Intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      # Secrets render to empty strings when unset — passing them anyway
      # makes Tauri treat APPLE_SIGNING_IDENTITY="" as an explicit (empty)
      # identity and codesign fails. Gate the signing steps on this instead.
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile=false

      - name: Freeze document engine (PyInstaller)
        working-directory: services/document-engine
        run: |
          uv sync --group build
          uv run pyinstaller packaging/pyinstaller.spec --noconfirm

      - name: Collect sidecar into Tauri resources
        env:
          RESEARCHAI_SIDECAR_MODE: binary
        run: node scripts/package/collect-sidecar.mjs

      - name: Build frontend
        run: pnpm --filter @researchai/desktop build

      # macOS signing: ad-hoc when secrets are absent (Gatekeeper bypass is
      # documented in PACKAGING.md).
      - name: Import macOS signing certificate
        if: runner.os == 'Macos' && env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "Importing Developer ID certificate into a temporary keychain"
          CERT_FILE=$(mktemp /tmp/certificate.XXXXXX.p12)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_FILE"
          KEYCHAIN_FILE=$(mktemp /tmp/keychain.XXXXXX.keychain-db)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"
          security default-keychain -s "$KEYCHAIN_FILE"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"
          security import "$CERT_FILE" -k "$KEYCHAIN_FILE" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"
          rm -f "$CERT_FILE"

      - name: Build installers (signed + notarized)
        if: env.HAS_SIGNING_IDENTITY == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm --filter @researchai/desktop exec tauri build --target ${{ matrix.target }}

      - name: Build installers (ad-hoc)
        if: env.HAS_SIGNING_IDENTITY != 'true'
        run: pnpm --filter @researchai/desktop exec tauri build --target ${{ matrix.target }}

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: researchai-${{ matrix.target }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
