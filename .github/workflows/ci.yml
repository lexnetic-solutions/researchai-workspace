name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: TypeScript · test & typecheck
    # pathway-solutions is a private MIRROR of this repo where Actions
    # minutes are capped (billing blocked) — skip there; full CI runs on
    # the public repo, whose Actions minutes are free.
    if: github.repository == 'lexnetic-solutions/researchai-workspace'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @researchai/desktop build

  engine:
    name: Python · document engine
    if: github.repository == 'lexnetic-solutions/researchai-workspace'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - run: uv sync
        working-directory: services/document-engine
      - run: uv run ruff check .
        working-directory: services/document-engine
      - run: uv run pytest
        working-directory: services/document-engine

  desktop:
    name: Desktop · ${{ matrix.os }}
    needs: [web, engine]
    if: github.repository == 'lexnetic-solutions/researchai-workspace' && github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15 # Apple Silicon (macos-14 retires 2026-11-02)
            target: aarch64-apple-darwin
          - os: macos-15-intel # Intel — macos-13 image retired 2025-12-04;
            # macos-15-intel is GitHub's last x86_64 image (supported to 2027-08).
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      # bundle.createUpdaterArtifacts requires the updater signing key when
      # `tauri build` runs (see tauri.conf.json plugins.updater.pubkey).
      # Every push therefore also rehearses real key usage end-to-end.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile=false
      # generate_context! requires frontendDist to exist at compile time.
      - name: Build frontend
        run: pnpm --filter @researchai/desktop build
      - name: Rust tests (unit + contract locks)
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib --test contract_locks
      - name: Build desktop bundle
        run: pnpm --filter @researchai/desktop tauri build
      # The updater config makes every `tauri build` sign its artefacts —
      # assert the signature contract on every push so a signing break is
      # caught here instead of at release time.
      - name: Verify updater artefacts (tar.gz + signatures)
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_DIR="apps/desktop/src-tauri/target/release/bundle"
          sig=$(find "$BUNDLE_DIR" -name '*.sig' -type f -print -quit)
          if [ -z "$sig" ]; then
            echo "::error::no updater signatures produced (signing key missing?)"
            exit 1
          fi
          case '${{ matrix.target }}' in
            *apple*)
              test -n "$(find "$BUNDLE_DIR" -name '*.app.tar.gz' -type f -print -quit)" || {
                echo "::error::no .app.tar.gz produced"; exit 1; }
              ;;
            *windows*)
              test -n "$(find "$BUNDLE_DIR" -name '*-setup.exe.sig' -type f -print -quit)" || {
                echo "::error::no NSIS setup.exe signature produced"; exit 1; }
              ;;
            *linux*)
              test -n "$(find "$BUNDLE_DIR" -name '*.AppImage.sig' -type f -print -quit)" || {
                echo "::error::no AppImage signature produced"; exit 1; }
              ;;
          esac
          echo "updater artefacts OK for ${{ matrix.target }} (sig: $(basename "$sig"))"
      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: researchai-${{ matrix.target }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/**/*.deb
          if-no-files-found: warn
