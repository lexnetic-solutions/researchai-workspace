name: Release dry-run

# Rehearses release.yml end-to-end WITHOUT publishing:
#   - triggered manually (Actions → Release dry-run → Run workflow) or when
#     release tooling changes (paths filter below);
#   - identical pipeline: PyInstaller sidecar freeze → sidecar collect →
#     frontend build → tauri bundle, on the same four-target matrix
#     (macOS arm64/x64, Windows x64, Linux x64);
#   - always ad-hoc signed: no signing secrets are passed and the signing
#     import step from release.yml is deliberately absent;
#   - the workflow token is read-only (contents: read), so it cannot create
#     a release even in principle — output is artefacts only.
#
# A green run here means a real `v*` tag will produce installers.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/release-dry-run.yml'
      - 'scripts/package/collect-sidecar.mjs'
      - 'scripts/release/build-install-guide.sh'
      - 'scripts/release/extract-notes.sh'
      - 'scripts/release/make-updater-manifest.sh'
      - 'CHANGELOG.md'
      - 'services/document-engine/packaging/pyinstaller.spec'
      - 'services/document-engine/src/researchai_document_engine/run.py'
      - 'apps/desktop/src-tauri/tauri.conf.json'

# Read-only token: release-attach needs contents:write, which is not
# granted — publishing is structurally impossible in this workflow.
permissions:
  contents: read

concurrency:
  group: release-dry-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundles:
    name: Dry-run · ${{ matrix.os }}
    # pathway-solutions is a private MIRROR of this repo where Actions
    # minutes are capped (billing blocked) — skip there; dry-runs run on
    # the public repo, whose Actions minutes are free.
    if: github.repository == 'lexnetic-solutions/researchai-workspace'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15 # Apple Silicon (macos-14 retires 2026-11-02)
            target: aarch64-apple-darwin
          - os: macos-15-intel # Intel — macos-13 image retired 2025-12-04;
            # macos-15-intel is GitHub's last x86_64 image (supported to 2027-08).
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Rehearse release.yml's notes extraction FIRST (cheap, fail-fast):
      # the newest stamped CHANGELOG section must extract cleanly —
      # non-empty, no headings, no reference-link footer. A changelog that
      # cannot satisfy this would publish a bad release body, so fail here
      # before spending minutes on PyInstaller + Tauri.
      - name: Verify CHANGELOG notes extraction (rehearsal)
        shell: bash
        run: |
          set -euo pipefail
          VER=$(grep -m1 -E '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md \
            | sed -E 's/^## \[([^]]+)\].*/\1/' || true)
          test -n "$VER" || { echo "::error::no stamped section in CHANGELOG.md"; exit 1; }
          scripts/release/extract-notes.sh "$VER" > release-notes.md
          test -s release-notes.md || {
            echo "::error::extraction for [$VER] produced an empty body"; exit 1; }
          if grep -q '^## \[' release-notes.md; then
            echo "::error::extracted body contains a heading (section bleed)"; exit 1
          fi
          if grep -q '^\[[^]]\+\]:' release-notes.md; then
            echo "::error::extracted body contains the link footer (footer bleed)"; exit 1
          fi
          echo "Extraction OK for [$VER]: $(wc -l < release-notes.md) lines"

      - name: Install Linux system dependencies (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile=false

      # The updater config (tauri.conf.json plugins.updater.pubkey) makes
      # `tauri build` sign artefacts. Rehearse that path with an ephemeral
      # throwaway key — deliberately NOT the release key, so a dry run can
      # never produce anything an installed app would accept.
      - name: Generate ephemeral updater signing key (rehearsal)
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @researchai/desktop exec tauri signer generate \
            --ci -p dry-run-ephemeral -f \
            -w "$RUNNER_TEMP/updater-dry-run.key"
          echo "TAURI_SIGNING_PRIVATE_KEY=$RUNNER_TEMP/updater-dry-run.key" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=dry-run-ephemeral" >> "$GITHUB_ENV"

      - name: Freeze document engine (PyInstaller)
        working-directory: services/document-engine
        run: |
          uv sync --group build
          uv run pyinstaller packaging/pyinstaller.spec --noconfirm

      - name: Collect sidecar into Tauri resources
        env:
          RESEARCHAI_SIDECAR_MODE: binary
        run: node scripts/package/collect-sidecar.mjs

      - name: Build frontend
        run: pnpm --filter @researchai/desktop build

      - name: Build installers (ad-hoc signed, dry-run)
        run: pnpm --filter @researchai/desktop exec tauri build --target ${{ matrix.target }}

      # Mirror release.yml: arch-qualify the macOS updater archive so the
      # manifest rehearsal below can glob one archive per architecture.
      - name: Arch-qualify the macOS updater archive (rehearsal)
        if: runner.os == 'MacOS'
        shell: bash
        run: |
          set -euo pipefail
          DIR="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          VERSION=$(jq -r '.version' apps/desktop/src-tauri/tauri.conf.json)
          case '${{ matrix.target }}' in
            aarch64-*) ARCH=aarch64 ;;
            x86_64-*)  ARCH=x64 ;;
            *) echo "::error::unexpected target ${{ matrix.target }}"; exit 1 ;;
          esac
          SRC="$DIR/ResearchAI Workspace.app.tar.gz"
          DST="$DIR/ResearchAI.Workspace_${VERSION}_${ARCH}.app.tar.gz"
          if [ ! -f "$SRC" ] || [ ! -f "$SRC.sig" ]; then
            echo "::error::updater archive missing: $SRC(.sig)"
            ls -la "$DIR"
            exit 1
          fi
          mv "$SRC" "$DST"
          mv "$SRC.sig" "$DST.sig"
          echo "updater archive: $(basename "$DST") ($(wc -c < "$DST") bytes)"

      - name: Verify bundles produced
        shell: bash
        run: |
          set -e
          BUNDLE_DIR="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          # No recursive listing here: under `set -e -o pipefail` a
          # `find | head` SIGPIPEs once a bundle staging dir exceeds the
          # line cap and would fail the step (seen in the first dry run on
          # Linux). The case checks below are the real assertions.
          case '${{ matrix.target }}' in
            *apple*)
              test -n "$(find "$BUNDLE_DIR" -name '*.dmg' -type f -print -quit)" || {
                echo "::error::no .dmg produced"; exit 1; }
              test -n "$(find "$BUNDLE_DIR" -name '*.app' -type d -print -quit)" || {
                echo "::error::no .app produced"; exit 1; }
              test -n "$(find "$BUNDLE_DIR" -name '*.app.tar.gz' -type f -print -quit)" || {
                echo "::error::no updater bundle (.app.tar.gz) produced"; exit 1; }
              test -n "$(find "$BUNDLE_DIR" -name '*.app.tar.gz.sig' -type f -print -quit)" || {
                echo "::error::no updater signature (.app.tar.gz.sig) produced"; exit 1; }
              ;;
            *windows*)
              test -n "$(find "$BUNDLE_DIR" -name '*.exe' -type f -print -quit)" || {
                echo "::error::no .exe produced"; exit 1; }
              test -n "$(find "$BUNDLE_DIR" -name '*-setup.exe.sig' -type f -print -quit)" || {
                echo "::error::no NSIS updater signature produced"; exit 1; }
              ;;
            *linux*)
              test -n "$(find "$BUNDLE_DIR" -name '*.AppImage' -type f -print -quit)" || {
                echo "::error::no .AppImage produced"; exit 1; }
              test -n "$(find "$BUNDLE_DIR" -name '*.AppImage.sig' -type f -print -quit)" || {
                echo "::error::no AppImage updater signature produced"; exit 1; }
              test -n "$(find "$BUNDLE_DIR" -name '*.deb' -type f -print -quit)" || {
                echo "::error::no .deb produced"; exit 1; }
              ;;
          esac
          echo "Bundle check passed for ${{ matrix.target }}"

      - name: Verify sidecar shipped inside the bundle
        shell: bash
        run: |
          set -e
          # Phase 9 contract: the frozen engine must ride along. On macOS we
          # can check the .app directly; NSIS compresses its payload into the
          # installer, so there we assert the collect step's output — the
          # exact directory bundle.resources packs — is present and non-empty.
          if [ '${{ runner.os }}' = 'Windows' ]; then
            test -n "$(find apps/desktop/src-tauri/packaging/resources/sidecar -type f -name '*.exe' -print -quit)" || {
              echo "::error::sidecar binary missing from packaging/resources/sidecar"; exit 1; }
          elif [ '${{ runner.os }}' = 'Linux' ]; then
            # AppImage/deb also compress payloads; assert the collect step's
            # output (the exact directory bundle.resources packs).
            test -n "$(find apps/desktop/src-tauri/packaging/resources/sidecar -type f -name 'researchai-engine*' -print -quit)" || {
              echo "::error::sidecar binary missing from packaging/resources/sidecar"; exit 1; }
          else
            BASE=$(find apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle -maxdepth 3 -type d -name 'ResearchAI Workspace.app' -print -quit)
            test -n "$BASE" || { echo "::error::.app bundle not found"; exit 1; }
            test -n "$(find "$BASE/Contents/Resources" -path '*sidecar*' -type f -print -quit)" || {
              echo "::error::sidecar missing from .app Resources"; exit 1; }
          fi
          echo "Sidecar presence check passed for ${{ matrix.target }}"

      - name: Upload artefacts (dry-run only)
        uses: actions/upload-artifact@v4
        with:
          name: researchai-dry-run-${{ matrix.target }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig
          retention-days: 7

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Release dry-run — ${{ matrix.os }} (${{ matrix.target }})"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Installers built | ${{ job.status == 'success' && '✅' || '❌' }} |"
            echo "| Sidecar shipped | see 'Verify sidecar shipped inside the bundle' step |"
            echo "| Updater artefacts (.tar.gz/.sig) | see 'Verify bundles produced' step |"
            echo "| Published to a GitHub release | **never** (read-only token) |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Rehearse release.yml's manifest job: download every matrix leg's signed
  # artefacts and build latest.json exactly as a real release would (minus
  # the upload — this workflow's token is read-only).
  manifest:
    name: Dry-run · updater manifest
    needs: bundles
    if: github.repository == 'lexnetic-solutions/researchai-workspace' && success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: researchai-dry-run-*
          path: updater-artifacts

      - name: Manifest script self-test
        run: bash scripts/release/make-updater-manifest.sh --self-test

      - name: Build latest.json (rehearsal)
        run: |
          set -euo pipefail
          VER=$(grep -m1 -E '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md \
            | sed -E 's/^## \[([^]]+)\].*/\1/')
          scripts/release/make-updater-manifest.sh \
            --tag "v$VER" \
            --repo "$GITHUB_REPOSITORY" \
            --artifacts updater-artifacts \
            --out latest.json
          jq -e '.platforms | keys | length == 8' latest.json >/dev/null
          # Mirror release.yml: a space (or %20) in a platform URL means
          # the manifest names Tauri's local file, not the published
          # asset — that download would 404 on every self-update.
          if jq -r '.platforms[].url' latest.json | grep -qE '%20| '; then
            echo "::error::latest.json platform URL carries a space (asset-name mismatch)"
            jq -r '.platforms[].url' latest.json
            exit 1
          fi
          echo "Manifest rehearsal OK for v$VER"
          jq '{version, pub_date, platforms: (.platforms | keys)}' latest.json

      # Rehearse the checksum step exactly as release.yml runs it.
      - name: Build SHA256SUMS (rehearsal)
        run: |
          set -euo pipefail
          mapfile -t files < <(find updater-artifacts -type f \
            \( -name '*_aarch64.dmg' -o -name '*_x64.dmg' -o -name '*_x64-setup.exe' \
               -o -name '*_amd64.AppImage' -o -name '*_amd64.deb' \) | sort)
          if [ "${#files[@]}" -ne 5 ]; then
            echo "::error::expected 5 installers, found ${#files[@]}"
            printf '%s\n' "${files[@]}"
            exit 1
          fi
          : > SHA256SUMS
          for f in "${files[@]}"; do
            # Mirror release.yml exactly: GitHub publishes release assets
            # with spaces replaced by dots (Tauri's local filename keeps
            # the space), so checksums must name what users download.
            name=$(basename "$f")
            sum=$( (cd "$(dirname "$f")" && sha256sum "$name") | cut -d' ' -f1)
            printf '%s  %s\n' "$sum" "${name// /.}" >> SHA256SUMS
          done
          sort -k2 SHA256SUMS -o SHA256SUMS
          cat SHA256SUMS
          if grep -qvE '^[0-9a-f]{64}  [^ ]+$' SHA256SUMS; then
            echo "::error::SHA256SUMS is not '<hash>  <space-free published name>' on every line"
            cat SHA256SUMS
            exit 1
          fi
          echo "SHA256SUMS rehearsal OK: $(wc -l < SHA256SUMS) entries"

      # Rehearse the install-guide step exactly as release.yml runs it.
      - name: Build install guide (rehearsal)
        run: |
          set -euo pipefail
          scripts/release/build-install-guide.sh SHA256SUMS \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/v0.0.0-rehearsal" \
            install-guide.md
          grep -q 'researchai-install-guide' install-guide.md
          [ "$(grep -c 'releases/download/v0.0.0-rehearsal' install-guide.md)" -eq 5 ]
          # nav (4) + trailing checksums link (1) = 5 prefixed fragments
          [ "$(grep -o '#user-content-' install-guide.md | wc -l)" -ge 5 ]
          if grep -q '{{' install-guide.md; then
            echo "::error::unresolved placeholder in install guide"
            exit 1
          fi
          echo "install guide rehearsal OK"
