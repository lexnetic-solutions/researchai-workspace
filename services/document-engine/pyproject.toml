[project]
name = "researchai-document-engine"
version = "0.1.5"
description = "ResearchAI document ingestion sidecar — parsing, OCR and structure extraction"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pydantic>=2.10",
    "pypdf>=6.1",
    "python-docx>=1.2",
    "charset-normalizer>=3.4",
    "fastembed>=0.8.1",
    "reportlab>=4.2",
    # onnxruntime stopped shipping macOS x86_64 wheels after 1.23.2, so Intel Macs
    # (the macos-15-intel release target) get that last compatible build while every
    # other platform keeps the fastembed-recommended latest release.
    "onnxruntime==1.23.2; sys_platform == 'darwin' and platform_machine == 'x86_64' and python_version < '3.14'",
    "onnxruntime==1.30.0; sys_platform != 'darwin' or platform_machine != 'x86_64' or python_version >= '3.14'",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]
build = [
    "pyinstaller>=6.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/researchai_document_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
