name: Release

# Phase 9 (spec §37/§48): tag-triggered installer builds. Builds the frozen
# document-engine sidecar per OS (PyInstaller), then the Tauri bundle, and
# attaches DMG/APP/NSIS/AppImage/deb artefacts to the GitHub release. macOS
# signing is enabled by repository secrets; without them builds are ad-hoc
# signed.

on:
  push:
    tags: ['v*']

# A dry-run rehearsal of this pipeline (no release attach, empty
# permissions) lives in release-dry-run.yml — run it when touching the
# packaging inputs before spending a real tag. The release body is
# extracted from the stamped CHANGELOG section for the tag
# (scripts/release/extract-notes.sh; rehearsal step in the dry-run).
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundles:
    name: Installers · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15 # Apple Silicon (macos-14 retires 2026-11-02)
            target: aarch64-apple-darwin
          - os: macos-15-intel # Intel — macos-13 image retired 2025-12-04;
            # macos-15-intel is GitHub's last x86_64 image (supported to 2027-08).
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      # Secrets render to empty strings when unset — passing them anyway
      # makes Tauri treat APPLE_SIGNING_IDENTITY="" as an explicit (empty)
      # identity and codesign fails. Gate the signing steps on this instead.
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
      # Updater signing (bundle.createUpdaterArtifacts + plugins.updater):
      # `tauri build` signs every updater artefact with this key. The
      # manifest job later fails the release if any .sig is missing.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile=false

      - name: Freeze document engine (PyInstaller)
        working-directory: services/document-engine
        run: |
          uv sync --group build
          uv run pyinstaller packaging/pyinstaller.spec --noconfirm

      - name: Collect sidecar into Tauri resources
        env:
          RESEARCHAI_SIDECAR_MODE: binary
        run: node scripts/package/collect-sidecar.mjs

      # Bundled AI: llama-server + starter GGUF (Apache-2.0) and the
      # pre-fetched embedding cache, so search and Ask-AI work offline
      # on first run. Pinned versions live in fetch-ai-assets.mjs.
      - name: Fetch bundled AI assets (llama-server + starter GGUF)
        run: node scripts/package/fetch-ai-assets.mjs

      - name: Seed embedding model into packaging resources
        working-directory: services/document-engine
        run: uv run python packaging/seed_embeddings.py

      - name: Build frontend
        run: pnpm --filter @researchai/desktop build

      # macOS signing: ad-hoc when secrets are absent (Gatekeeper bypass is
      # documented in PACKAGING.md).
      - name: Import macOS signing certificate
        if: runner.os == 'Macos' && env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "Importing Developer ID certificate into a temporary keychain"
          CERT_FILE=$(mktemp /tmp/certificate.XXXXXX.p12)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_FILE"
          KEYCHAIN_FILE=$(mktemp /tmp/keychain.XXXXXX.keychain-db)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"
          security default-keychain -s "$KEYCHAIN_FILE"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"
          security import "$CERT_FILE" -k "$KEYCHAIN_FILE" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"
          rm -f "$CERT_FILE"

      - name: Build installers (signed + notarized)
        if: env.HAS_SIGNING_IDENTITY == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm --filter @researchai/desktop exec tauri build --target ${{ matrix.target }}

      - name: Build installers (ad-hoc)
        if: env.HAS_SIGNING_IDENTITY != 'true'
        run: pnpm --filter @researchai/desktop exec tauri build --target ${{ matrix.target }}

      # The macOS updater archive is named after the .app bundle
      # ("ResearchAI Workspace.app.tar.gz") — identical on both mac legs.
      # Arch-qualify it (and its .sig) so the release assets cannot collide
      # and so make-updater-manifest.sh can glob one archive per arch.
      - name: Arch-qualify the macOS updater archive
        if: runner.os == 'MacOS'
        shell: bash
        run: |
          set -euo pipefail
          DIR="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          VERSION=$(jq -r '.version' apps/desktop/src-tauri/tauri.conf.json)
          case '${{ matrix.target }}' in
            aarch64-*) ARCH=aarch64 ;;
            x86_64-*)  ARCH=x64 ;;
            *) echo "::error::unexpected target ${{ matrix.target }}"; exit 1 ;;
          esac
          SRC="$DIR/ResearchAI Workspace.app.tar.gz"
          DST="$DIR/ResearchAI.Workspace_${VERSION}_${ARCH}.app.tar.gz"
          if [ ! -f "$SRC" ] || [ ! -f "$SRC.sig" ]; then
            echo "::error::updater archive missing: $SRC(.sig)"
            ls -la "$DIR"
            exit 1
          fi
          mv "$SRC" "$DST"
          mv "$SRC.sig" "$DST.sig"
          echo "updater archive: $(basename "$DST") ($(wc -c < "$DST") bytes)"

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: researchai-${{ matrix.target }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig

      # The release body comes from the stamped CHANGELOG section for this
      # tag (release-bump stamps it before tagging). An empty extraction
      # falls back to a generic body so a release never ships with an
      # empty notes field again (v0.1.1 did before the backfill).
      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          set -euo pipefail
          # `|| true`: any extractor failure (e.g. missing CHANGELOG) must
          # degrade to the fallback body, never block attaching installers.
          scripts/release/extract-notes.sh "$GITHUB_REF_NAME" > release-notes.md || true
          if [ ! -s release-notes.md ]; then
            echo "::warning::no stamped CHANGELOG section for $GITHUB_REF_NAME — using fallback body"
            printf 'See [CHANGELOG.md](https://github.com/%s/blob/%s/CHANGELOG.md) for the full history.\n' \
              "$GITHUB_REPOSITORY" "$GITHUB_SHA" > release-notes.md
          fi
          echo "Release notes: $(wc -l < release-notes.md) lines"

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig

  # Static updater manifest: installed apps poll
  #   https://github.com/<repo>/releases/latest/download/latest.json
  # so the release must carry it alongside the installers. Runs after every
  # matrix leg has attached its assets; the script hard-fails when an
  # artefact or its .sig is missing, leaving the release without a manifest
  # rather than publishing one that would break self-update.
  manifest:
    name: Updater manifest (latest.json)
    needs: bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: updater-artifacts

      - name: Build latest.json from the signed updater artefacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The release body (stamped CHANGELOG section) doubles as the
          # manifest's user-facing `notes` field.
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
            --json body -q .body > release-notes.md
          scripts/release/make-updater-manifest.sh \
            --tag "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --artifacts updater-artifacts \
            --notes release-notes.md \
            --out latest.json
          jq . latest.json

      - name: Attach manifest to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" latest.json --clobber -R "$GITHUB_REPOSITORY"
